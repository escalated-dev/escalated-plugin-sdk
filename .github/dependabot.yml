version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    ignore:
      # @types/node tracks the oldest Node the CI matrix supports (20).
      # Bumping it past that would type-check against APIs the runtime lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint declares peer typescript '>=4.8.4 <6.1.0', and
      # DefinitelyTyped has published no @types/node supporting TS 6 yet,
      # so TS 6/7 cannot build here.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
